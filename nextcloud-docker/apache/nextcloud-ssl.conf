# Enables mod_ssl for the local HTTPS vhost (nextcloud-8443.conf), using the
# self-signed cert generated by `make certificates`. Installed by that target
# to /tmp/nextcloud-ssl.conf, which docker-compose.yml bind-mounts to
# /etc/apache2/mods-enabled/nextcloud.conf inside the nextcloud-app container.
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so

SSLRandomSeed startup builtin
SSLRandomSeed connect builtin

SSLCipherSuite HIGH:!aNULL:!MD5
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLHonorCipherOrder on
SSLSessionCache shmcb:${APACHE_RUN_DIR}/ssl_scache(512000)
SSLSessionCacheTimeout 300
