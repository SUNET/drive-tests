# Local HTTPS vhost using the self-signed cert generated by `make
# certificates`. Installed by that target to /tmp/nextcloud-8443.conf, which
# docker-compose.yml bind-mounts to /etc/apache2/sites-enabled/nextcloud.conf
# inside the nextcloud-app container.
<VirtualHost *:443>
	ServerName localhost
	DocumentRoot /var/www/html

	SSLEngine on
	SSLCertificateFile /etc/ssl/private/localhost.pem
	SSLCertificateKeyFile /etc/ssl/private/localhost.pem

	<Directory /var/www/html/>
		Options +FollowSymlinks
		AllowOverride All
		<IfModule mod_dav.c>
			Dav off
		</IfModule>
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/nextcloud-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/nextcloud-ssl-access.log combined
</VirtualHost>
