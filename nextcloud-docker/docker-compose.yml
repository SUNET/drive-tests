  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - sciencemesh-federation

  mock-oauth2-server:
    container_name: nextcloud-local-mock-oauth
    image: ghcr.io/navikt/mock-oauth2-server:2.1.1
    stdin_open: true
    tty: true
    ports:
      - 8880:8880
    environment:
      - SERVER_PORT=8880
    networks:
      - sciencemesh-federation

  # One-shot: rustfs's container runs as uid 10001, which can't write to a
  # freshly-created named volume (owned by root) without this.
  rustfs-perms:
    image: busybox:latest
    container_name: nextcloud-local-rustfs-perms
    command: chown -R 10001:10001 /data
    volumes:
      - rustfs-data:/data
    networks:
      - sciencemesh-federation
    restart: "no"

  rustfs:
    container_name: nextcloud-local-rustfs
    image: rustfs/rustfs:latest
    restart: always
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      # The 4 RUSTFS_VOLUMES paths are subdirectories of one Docker volume,
      # i.e. the same physical disk -- fine for local testing, but RustFS's
      # erasure-coding startup check refuses to run that way unless told to.
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    ports:
      - 9000:9000
      - 9001:9001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sciencemesh-federation

networks:
  sciencemesh-federation:
    name: sciencemesh-federation
